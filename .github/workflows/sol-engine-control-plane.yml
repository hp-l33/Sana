name: Sol Engine control plane

on:
  push:
    branches:
      - "agent/**"
  pull_request:

jobs:
  control-plane:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Engine
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q sol tests
      - name: Contract tests
        run: python -m unittest discover -s tests -v
      - name: Blank-slate health
        run: |
          sol doctor --json
          test "$(sol models --json)" = "[]"
      - name: Check whitespace
        run: git diff --check
