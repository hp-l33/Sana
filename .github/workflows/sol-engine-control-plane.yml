name: Sol-Engine control plane

on:
  push:
    branches:
      - "agent/**"
  pull_request:

jobs:
  control-plane:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install control plane
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q sol_engine techniques tests/control_plane
      - name: Contract tests
        run: python -m unittest discover -s tests/control_plane -v
      - name: Metadata doctor
        run: sol-engine doctor
      - name: Resolve LTX-2.3 release recipe
        run: sol-engine plan recipes/ltx23/fullopt.toml --json > /tmp/ltx23-plan.json
