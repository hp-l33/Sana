[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sol-engine"
version = "0.2.0.dev0"
description = "Adaptation-first engine for optimized generative-model releases"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = []

[project.scripts]
sol = "sol.cli:main"
sol-engine = "sol.cli:main"

[tool.setuptools.packages.find]
include = ["sol*"]

[tool.setuptools.package-data]
"*" = ["plugin.toml", "presets/*.toml"]
