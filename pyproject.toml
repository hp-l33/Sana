[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sol-engine"
version = "0.1.0.dev0"
description = "Experimental side-effect-free control plane for Sol-Engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
runtime = ["torch>=2.6"]
test = []

[project.scripts]
sol-engine = "sol_engine.cli:main"

[tool.setuptools.packages.find]
include = ["sol_engine*", "techniques*"]

[tool.setuptools.package-data]
sol_engine = ["catalog.toml"]
