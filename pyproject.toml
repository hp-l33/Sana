[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sol-engine"
version = "0.1.0.dev0"
description = "Composable video-generation optimization engine with Diffusers semantics and high-performance backends"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
runtime = ["torch>=2.6"]
test = []

[project.scripts]
sol = "sol.cli:main"
sol-engine = "sol.cli:main"

[tool.setuptools.packages.find]
include = ["sol*"]

[tool.setuptools.package-data]
sol = ["catalog.toml"]
"sol.plugins.ltx23" = ["*.toml", "presets/*.toml", "launch/*.toml"]
