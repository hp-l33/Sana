schema_version = 1

# Model entries contain only discovery metadata. Capabilities are derived from
# each selected profile's [seam_status] table by ProfileModelPlugin.
[models.cosmos3]
provider = "sol.plugins.profile:ProfileModelPlugin"
profile = "models/cosmos3.toml"
status = "profile_only"

[models.hunyuan_video]
provider = "sol.plugins.profile:ProfileModelPlugin"
profile = "models/hunyuan_video.toml"
status = "profile_only"

[models.lingbot_video]
provider = "sol.plugins.profile:ProfileModelPlugin"
profile = "models/lingbot_video.toml"
status = "profile_only"

[models.ltx23]
provider = "sol.plugins.ltx23:LTX23Plugin"
profile = "sol/plugins/ltx23/profile.toml"
presets = ["baseline", "fullopt"]
status = "released"
references = ["diffusers"]
backends = ["sglang"]
default_backend = "sglang"

[models.minimax_h3]
provider = "sol.plugins.profile:ProfileModelPlugin"
profile = "models/minimax_h3.toml"
status = "profile_only"

[models.sana_video]
provider = "sol.plugins.profile:ProfileModelPlugin"
profile = "models/sana_video.toml"
status = "profile_only"

[models.wan21_t2v_1_3b]
provider = "sol.plugins.profile:ProfileModelPlugin"
profile = "models/wan21_t2v_1_3b.toml"
status = "profile_only"

[models.wan21_t2v_14b]
provider = "sol.plugins.profile:ProfileModelPlugin"
profile = "models/wan21_t2v_14b.toml"
status = "profile_only"

[models.wan22_t2v_a14b]
provider = "sol.plugins.profile:ProfileModelPlugin"
profile = "models/wan22_t2v_a14b.toml"
status = "profile_only"

[models.wan22_ti2v_5b]
provider = "sol.plugins.profile:ProfileModelPlugin"
profile = "models/wan22_ti2v_5b.toml"
status = "profile_only"

# These aliases are a UI layer over canonical module:qualname references. The
# catalog never imports the modules while it is being listed or parsed.
[optimizations.payload_cache]
kind = "runtime_technique"
provider = "sol.optimizations.methods.payload_cache:PayloadCache"

[optimizations.step_cache]
kind = "runtime_technique"
provider = "sol.optimizations.methods.step_cache:StepCache"

[optimizations.teacache]
kind = "runtime_technique"
provider = "sol.optimizations.methods.teacache:TeaCache"

[optimizations.teacache_residual]
kind = "runtime_technique"
provider = "sol.optimizations.methods.teacache:TeaCacheResidual"

[optimizations.token_prune]
kind = "runtime_technique"
provider = "sol.optimizations.methods.token_prune:TokenPrune"

[optimizations.kwl_fusions]
kind = "build_transform"
provider = "sol.optimizations.transforms.kwl_fusions:KWLFusions"

[optimizations.nvfp4_ffn]
kind = "build_transform"
provider = "sol.optimizations.transforms.nvfp4_ffn:NVFP4FFN"

[optimizations.sparse_attention]
kind = "build_transform"
provider = "sol.optimizations.transforms.sparse_attention:SparseAttention"
