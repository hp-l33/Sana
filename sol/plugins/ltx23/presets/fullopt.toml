schema_version = 1
name = "fullopt"
backend = "sglang"
launch = "../launch/fullopt.toml"
preview_stage = "stage2"
description = "Verified LTX-2.3 full-stack acceleration preset."

[[optimization]]
id = "kwl_fusions"
stages = ["stage1", "stage2"]

[optimization.options]
kwl_adapter = "ltx2"

[[optimization]]
id = "nvfp4_ffn"
stages = ["stage1", "stage2"]

[optimization.options]
module_scope = "video_ffn"

[[optimization]]
id = "sparse_attention"
stages = ["stage2"]

[optimization.options]
sparsity = 0.9
component = "transformer_2"
stage2_dense_layers = "0-1"

[[optimization]]
id = "step_cache"
stages = ["stage1"]

[optimization.options]
skip = "16-28"

[[optimization]]
id = "token_prune"
stages = ["stage2"]

[optimization.options]
keep_ratio = 0.5
method = "feat_norm"
compensation = "prev"
steps = "1-2"
