# These aliases are a UI layer over canonical module:qualname references. The
# catalog never imports the modules while it is being listed or parsed.
[optimizations.payload_cache]
kind = "runtime_technique"
provider = "techniques.methods.payload_cache:PayloadCache"

[optimizations.step_cache]
kind = "runtime_technique"
provider = "techniques.methods.step_cache:StepCache"

[optimizations.teacache]
kind = "runtime_technique"
provider = "techniques.methods.teacache:TeaCache"

[optimizations.teacache_residual]
kind = "runtime_technique"
provider = "techniques.methods.teacache:TeaCacheResidual"

[optimizations.token_prune]
kind = "runtime_technique"
provider = "techniques.methods.token_prune:TokenPrune"

[optimizations.kwl_fusions]
kind = "build_transform"
provider = "techniques.transforms.kwl_fusions:KWLFusions"

[optimizations.nvfp4_ffn]
kind = "build_transform"
